name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Point this at your deployed proxy. Leave it unset to build with the
      # emulator default (http://10.0.2.2:8787); users can also change the
      # address later from Settings -> API server.
      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: railpulse-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
